[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "avatar-face"
version = "0.1.0"
description = "Generación eficiente de rostros de avatares para Android."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]
feasibility = [
  # Último wheel de PyTorch publicado para macOS Intel; NumPy 2 no es compatible.
  "numpy>=1.26,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "torch==2.2.2",
]
dataset = [
  "Pillow>=10.4,<13",
]
training = [
  "Pillow>=10.4,<13",
  "torch==2.2.2",
]

[project.scripts]
avatar-face = "avatar_face.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_face"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["avatar_face"]
